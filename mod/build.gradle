plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
    id 'java'
}

version = '1.1.13'
group = 'dev.buildassist'

base { archivesName = 'buildassist-mod' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

loom {
    mixin.defaultRefmapName = 'buildassist.refmap.json'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.140.2+1.21.11'

    // Gson for config serialization
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "${it}_${base.archivesName.get()}" } }
}
